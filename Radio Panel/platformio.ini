[platformio]
default_envs = mega2560_pro_mini
src_dir = .

[env]
platform = atmelavr
framework = arduino
monitor_speed = 250000
build_src_filter =
  +<F14_Radio_Panel.cpp>
lib_deps =
  https://github.com/DCS-Skunkworks/dcs-bios-arduino-library.git#0.3.13
  https://github.com/jasonacox/TM1637TinyDisplay.git

[env:mega2560_pro_mini]
board = megaatmega2560
